agents:
  queue: "hosted-autoscaling-linux"  # Auto-scaling agent queue

steps:
  # Parallel build steps showcasing language support
  - group: ":package: Build & Test"
    steps:
      - label: ":java: Java Maven Build"
        command: .buildkite/scripts/maven_build.sh
        artifact_paths: "target/*.jar"

      - label: ":javascript: Node.js Build"
        command: .buildkite/scripts/nodejs_build.sh
        artifact_paths: "dist/**/*"

      - label: ":remix: Remix Framework"
        command: .buildkite/scripts/remix_build.sh
        env:
          NODE_ENV: "production"

      - label: ":python: Python Tests"
        command: .buildkite/scripts/python_tests.sh
        artifact_paths: "coverage/**/*"

  # Mobile builds
  - group: ":mobile_phone: Mobile Builds"
    steps:
      - label: ":ios: iOS Build"
        command: .buildkite/scripts/ios_build.sh
        agents:
          queue: "hosted-autoscaling-macos"

      - label: ":android: Android Build"
        command: .buildkite/scripts/android_build.sh
        artifact_paths: "app/build/outputs/apk/**/*.apk"

  # Security scanning with auto-retry on simulated failure
  - label: ":lock: Security Scan"
    command: ".buildkite/scripts/security_scan.sh"
    plugins:
      - docker#v5.11.0:
          image: "aquasec/trivy:latest"
          mount-checkout: true
    retry:
      automatic:
        - exit_status: 2  # Simulated transient failure
          limit: 3
        - exit_status: "*"
          limit: 1

  # Wait for all previous steps
  - wait

  # Integration tests
  - label: ":test_tube: Integration Tests"
    command: ".buildkite/scripts/integration_tests.sh"

  # S3 artifact upload (native integration)
  - label: ":s3: Upload to S3"
    command: .buildkite/scripts/s3_upload.sh
    env:
      AWS_DEFAULT_REGION: "us-east-1"

  # Final security report
  - label: ":shield: Security Report"
    command: .buildkite/scripts/security_report.sh
